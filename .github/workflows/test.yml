name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow é opcional no código, mas com ele os testes de edição localizada rodam (sem ele são pulados).
      - run: pip install pillow
      # Sem chave, sem rede de verdade e sem custo: OpenAI falsa local. O mesmo comando vale na máquina do dev.
      - run: sh test/run_tests.sh
